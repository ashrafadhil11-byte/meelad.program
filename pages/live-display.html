<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Championship Signage</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* CSS Variables & Fonts */
        :root {
            --bg-color: #050507;
            --accent-glow: rgba(255, 183, 3, 0.15);
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: #ffffff;
            margin: 0;
            overflow: hidden; /* Perfect for Yodeck */
        }
        h1, h2, h3, .poster-font { font-family: 'Space Grotesk', sans-serif; }

        /* Cinematic Background */
        .ambient-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1;
            background: radial-gradient(circle at 80% 20%, var(--accent-glow) 0%, transparent 40%),
                        radial-gradient(circle at 20% 80%, rgba(79, 70, 229, 0.1) 0%, transparent 40%);
            filter: blur(60px);
        }

        /* 
         * RESPONSIVE LAYOUT ENGINE 
         * Automatically switches based on the TV's physical rotation
         */
        .signage-layout {
            display: grid;
            width: 100vw;
            height: 100vh;
        }

        /* LANDSCAPE (Horizontal TVs) */
        @media (orientation: landscape) {
            .signage-layout {
                grid-template-columns: 380px 1fr;
                grid-template-rows: 1fr 64px;
                grid-template-areas:
                    "sidebar main"
                    "ticker ticker";
            }
            .sidebar { border-right: 1px solid rgba(255,255,255,0.05); }
        }

        /* PORTRAIT (Vertical TVs) */
        @media (orientation: portrait) {
            .signage-layout {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr auto 64px;
                grid-template-areas:
                    "sidebar"
                    "main"
                    "sponsors" /* Sponsors move below main content in portrait */
                    "ticker";
            }
            .sidebar { border-bottom: 1px solid rgba(255,255,255,0.05); flex-direction: row !important; align-items: center; justify-content: space-between; padding: 2rem !important; }
            .sidebar-metrics { display: flex; gap: 2rem; }
            .sponsor-zone { grid-area: sponsors; border-top: 1px solid rgba(255,255,255,0.05); padding: 2rem; }
        }

        /* View Transitions */
        .screen-view { display: none; opacity: 0; }
        .screen-view.active { display: flex; animation: fadeSlideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeSlideUp {
            0% { opacity: 0; transform: translateY(40px) scale(0.98); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Marquee */
        .marquee-container { grid-area: ticker; background: #fbbf24; color: #000; overflow: hidden; display: flex; align-items: center; }
        .marquee-track { display: flex; white-space: nowrap; animation: scrollLeft 30s linear infinite; }
        @keyframes scrollLeft { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        /* Progress Bar */
        #rotatorProgressFill { transition: width 8000ms linear; }
    </style>
</head>
<body>
    <div class="ambient-bg"></div>

    <div class="signage-layout">
        
        <!-- SIDEBAR / TOP HEADER -->
        <aside class="sidebar grid-area-[sidebar] flex flex-col p-8 bg-black/40 backdrop-blur-xl relative">
            <div class="flex-1">
                <div class="inline-flex items-center gap-2 px-3 py-1 mb-6 rounded-full bg-red-500/10 border border-red-500/20 text-red-500 text-xs font-bold tracking-widest uppercase">
                    <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span> Live Broadcast
                </div>
                
                <h1 id="liveMeeladName" class="text-4xl font-black poster-font leading-none tracking-tight mb-2 uppercase">CHAMPIONSHIP</h1>
                <p id="statLastUpdated" class="text-neutral-500 text-sm font-medium">Last updated: --:--</p>
                
                <div class="sidebar-metrics mt-12 space-y-6">
                    <div>
                        <div class="text-xs text-neutral-500 uppercase tracking-widest font-bold mb-1">Programs Completed</div>
                        <div id="statCompletedProg" class="text-3xl poster-font font-bold text-white">- / -</div>
                    </div>
                    <div>
                        <div class="text-xs text-neutral-500 uppercase tracking-widest font-bold mb-1">Overall Progress</div>
                        <div id="statProgressPct" class="text-3xl poster-font font-bold text-amber-400">-%</div>
                    </div>
                </div>
            </div>

            <!-- SPONSOR ZONE -->
            <div class="sponsor-zone mt-8 landscape:pt-8 landscape:border-t landscape:border-white/5">
                <div class="text-[10px] text-neutral-500 uppercase tracking-widest font-bold mb-4">Presented By</div>
                <div id="sponsorLogoContainer" class="flex flex-wrap items-center gap-6 opacity-80 mix-blend-screen">
                    <!-- Replace these src attributes with your actual sponsor logos -->
                    <h2 class="text-xl poster-font text-neutral-400 font-bold">SPONSOR 1</h2>
                    <h2 class="text-xl poster-font text-neutral-400 font-bold">SPONSOR 2</h2>
                </div>
            </div>
        </aside>

        <!-- MAIN CONTENT AREA -->
        <main class="grid-area-[main] relative flex flex-col overflow-hidden p-12">
            
            <!-- Screen Title Indicator -->
            <div class="flex items-center justify-between mb-12">
                <div>
                    <h2 id="viewTitle" class="text-5xl poster-font font-black uppercase tracking-tight text-white">Standings</h2>
                    <span id="viewCategoryBadge" class="hidden mt-2 inline-block text-sm font-bold uppercase tracking-widest text-amber-400"></span>
                </div>
                <div class="w-32 h-1 bg-white/10 rounded-full overflow-hidden">
                    <div id="rotatorProgressFill" class="h-full bg-amber-400 w-0"></div>
                </div>
            </div>

            <!-- VIEW 1: TEAM STANDINGS -->
            <div id="screenTeamChampionship" class="screen-view flex-1 flex-col justify-center w-full max-w-6xl mx-auto">
                <div id="teamChampionshipGrid" class="space-y-6">
                    <!-- JS Injected -->
                </div>
            </div>

            <!-- VIEW 2: CATEGORY LEADERS -->
            <div id="screenCategoryLeaders" class="screen-view flex-1 flex-col justify-center w-full max-w-5xl mx-auto">
                <div id="categoryLeadersContainer">
                    <!-- JS Injected -->
                </div>
            </div>

            <!-- VIEW 3: COMPARISON -->
            <div id="screenCategoryComparison" class="screen-view flex-1 flex-col justify-center w-full max-w-6xl mx-auto">
                <div id="categoryComparisonContainer" class="space-y-4">
                    <!-- JS Injected -->
                </div>
            </div>
        </main>

        <!-- TICKER MARQUEE -->
        <footer class="marquee-container">
            <div class="px-6 font-black poster-font uppercase tracking-widest border-r border-black/20 flex items-center h-full z-10 bg-amber-400">
                Latest Results
            </div>
            <div class="flex-1 overflow-hidden h-full flex items-center">
                <div id="ribbonTrack" class="marquee-track px-4 gap-12 font-semibold text-lg">
                    <!-- JS Injected -->
                </div>
            </div>
        </footer>

    </div>

    <script type="module" src="../js/live-display.js"></script>
</body>
</html>
