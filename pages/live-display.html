<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Championship Signage - Landscape</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Manjari:wght@400;700&family=Anek+Malayalam:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;600;700;800;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --sand-bg: #f5ebe1;
            --text-dark: #1e1b18;
            --glass-bg: rgba(255, 255, 255, 0.76);
            --glass-border: rgba(210, 185, 155, 0.45);
        }

        body { font-family: 'Plus Jakarta Sans', 'Manjari', sans-serif; background-color: var(--sand-bg); color: var(--text-dark); margin: 0; overflow: hidden; user-select: none; }
        .cinzel-font { font-family: 'Cinzel', serif; }
        .mono-font { font-family: 'JetBrains Mono', monospace; }
        .ml-font { font-family: 'Anek Malayalam', 'Manjari', sans-serif; }

        .bg-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0; background: url('../assets/MLDBGLND.png'), url('../assets/MLDBG.svg'), #f5ebe1; background-size: cover; background-position: right bottom; background-repeat: no-repeat; }
        .glass-panel { background: var(--glass-bg); backdrop-filter: blur(14px); border: 1px solid var(--glass-border); box-shadow: 0 16px 36px -10px rgba(78, 52, 28, 0.08); }
        .svg-mask { -webkit-mask-size: contain; mask-size: contain; -webkit-mask-position: center; mask-position: center; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; }

        .screen-view { display: none; opacity: 0; }
        .screen-view.active { display: flex; animation: modernFadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes modernFadeIn { from { opacity: 0; transform: translateY(12px) scale(0.99); } to { opacity: 1; transform: translateY(0) scale(1); } }

        .poster-overlay-active { display: flex !important; animation: fadeInOverlay 0.5s ease forwards; }
        .poster-overlay-exit { animation: fadeOutOverlay 0.6s ease forwards; }
        @keyframes fadeInOverlay { from { opacity: 0; backdrop-filter: blur(0px); } to { opacity: 1; backdrop-filter: blur(12px); } }
        @keyframes fadeOutOverlay { from { opacity: 1; backdrop-filter: blur(12px); } to { opacity: 0; backdrop-filter: blur(0px); } }

        .poster-card-entrance { animation: cardPop 0.8s cubic-bezier(0.2, 1.2, 0.3, 1) forwards; }
        @keyframes cardPop { 0% { opacity: 0; transform: scale(0.8) translateY(40px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }

        .vertical-results-watermark {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-size: 10vh;
            font-weight: 900;
            letter-spacing: 0.35em;
            color: transparent;
            -webkit-text-stroke: 1.5px rgba(0, 0, 0, 0.04);
            line-height: 1;
        }

        .marquee-track { display: flex; white-space: nowrap; animation: marqueeSlide 30s linear infinite; }
        @keyframes marqueeSlide { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
    </style>
</head>
<body class="h-screen w-screen relative flex items-center justify-center">
    <div class="bg-canvas"></div>

    <div class="relative z-10 h-screen w-screen flex flex-col justify-between">
        
        <!-- TOP ZONE: TV-Safe Header Bar -->
        <header class="px-6 md:px-10 pt-6 pb-2 flex items-center justify-between w-full transition-opacity duration-500 gap-4" id="normalTopHeader">
            <div class="flex items-center gap-4 flex-shrink-0 min-w-0">
                <img src="../assets/icflgo.svg" alt="Main Logo" class="h-12 md:h-14 w-auto object-contain drop-shadow-md flex-shrink-0">
                <div class="flex flex-col justify-center mt-1 overflow-hidden">
                    <div class="flex items-center gap-2 mb-0.5">
                        <span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full bg-emerald-700/10 text-emerald-800 text-[9px] md:text-[10px] font-black tracking-widest uppercase border border-emerald-700/20 whitespace-nowrap">
                            <span class="w-1.5 h-1.5 md:w-2 md:h-2 rounded-full bg-emerald-600 animate-pulse"></span> LIVE BROADCAST
                        </span>
                        <span id="statLastUpdated" class="text-[10px] md:text-xs text-stone-500 font-semibold tracking-wide whitespace-nowrap">Syncing...</span>
                    </div>
                    <h1 id="liveMeeladName" class="cinzel-font text-xl md:text-2xl lg:text-3xl font-black tracking-tight text-stone-900 leading-none whitespace-nowrap truncate">MEELAD CHAMPIONSHIP</h1>
                </div>
            </div>

            <div class="flex items-center gap-4 md:gap-6 flex-shrink-0">
                <div class="glass-panel rounded-xl md:rounded-2xl px-4 md:px-5 py-1.5 md:py-2 flex items-center gap-4 md:gap-6 border">
                    <div class="text-left">
                        <div class="text-[9px] md:text-[10px] uppercase tracking-widest font-black text-stone-500 whitespace-nowrap">Programs</div>
                        <div id="statCompletedProg" class="mono-font text-base md:text-lg font-bold text-emerald-800">- / -</div>
                    </div>
                    <div class="h-6 w-px bg-stone-300"></div>
                    <div class="text-left">
                        <div class="text-[9px] md:text-[10px] uppercase tracking-widest font-black text-stone-500 whitespace-nowrap">Progress</div>
                        <div id="statProgressPct" class="mono-font text-base md:text-lg font-bold text-amber-700">-%</div>
                    </div>
                    <div class="h-6 w-px bg-stone-300"></div>
                    <div class="text-left">
                        <div class="text-[9px] md:text-[10px] uppercase tracking-widest font-black text-stone-500 whitespace-nowrap">Pending</div>
                        <div id="statPendingProg" class="mono-font text-base md:text-lg font-bold text-stone-700">-</div>
                    </div>
                </div>
                <div class="w-10 h-10 md:w-14 md:h-14 bg-amber-700/90 svg-mask drop-shadow-md flex-shrink-0" style="-webkit-mask-image: url('../assets/qlb.svg'); mask-image: url('../assets/qlb.svg');"></div>
            </div>
        </header>

        <!-- MIDDLE ZONE: TV-Safe Main Viewport -->
        <main class="flex-1 w-full md:w-[60%] lg:w-[55%] px-6 md:px-10 py-1 flex flex-col justify-center relative">
            <div class="flex items-center justify-between mb-4 md:mb-6 transition-opacity duration-500 gap-4" id="normalViewHeader">
                <div class="flex items-center gap-3 min-w-0">
                    <span id="viewTitle" class="cinzel-font text-xl md:text-2xl font-black uppercase text-stone-800 tracking-wider whitespace-nowrap truncate">Overall Standings</span>
                    <span id="viewCategoryBadge" class="hidden text-[10px] md:text-xs font-bold uppercase tracking-wider px-2.5 py-0.5 rounded-md bg-amber-500/20 text-amber-900 border border-amber-500/30 whitespace-nowrap flex-shrink-0"></span>
                </div>
                <div class="flex-1 max-w-[120px] md:max-w-[150px] h-1 md:h-1.5 bg-stone-300/60 rounded-full overflow-hidden flex-shrink-0 ml-4">
                    <div id="rotatorProgressFill" class="h-full bg-emerald-700 w-0"></div>
                </div>
            </div>

            <div id="screenTeamChampionship" class="screen-view active flex-col w-full">
                <div id="teamChampionshipGrid" class="space-y-2 md:space-y-3 w-full"></div>
            </div>
            <div id="screenCategoryLeaders" class="screen-view flex-col w-full">
                <div id="categoryLeadersContainer" class="w-full"></div>
            </div>
            <div id="screenCategoryComparison" class="screen-view flex-col w-full">
                <div id="categoryComparisonContainer" class="space-y-2 md:space-y-3 w-full"></div>
            </div>
        </main>

        <!-- BOTTOM ZONE -->
        <footer class="w-full flex flex-col transition-opacity duration-500" id="normalFooter">
            <div class="px-6 md:px-10 py-1.5 md:py-2 flex items-center justify-between">
                <div class="flex items-center gap-4 md:gap-6">
                    <span class="text-[9px] md:text-[10px] font-black uppercase tracking-widest text-stone-500">Official Sponsors</span>
                    <div id="sponsorLogoContainer" class="flex items-center gap-3 md:gap-5">
                        <span class="text-[10px] md:text-xs font-black tracking-wider text-stone-700 bg-white/70 border border-stone-200 px-2 md:px-3 py-0.5 md:py-1 rounded shadow-xs whitespace-nowrap">AL-FARHA CARGO</span>
                        <span class="text-[10px] md:text-xs font-black tracking-wider text-stone-700 bg-white/70 border border-stone-200 px-2 md:px-3 py-0.5 md:py-1 rounded shadow-xs whitespace-nowrap">NUVAN LOGISTICS</span>
                    </div>
                </div>
            </div>
            <div class="h-10 md:h-11 bg-stone-900 text-stone-100 flex items-center overflow-hidden shadow-lg border-t border-amber-600/30">
                <div class="h-full px-4 md:px-5 bg-amber-600 text-stone-950 font-black text-[10px] md:text-xs uppercase tracking-widest flex items-center gap-2 flex-shrink-0 z-10 shadow-md whitespace-nowrap">
                    <span>🔥</span> RESULTS
                </div>
                <div class="flex-1 overflow-hidden h-full flex items-center">
                    <div id="ribbonTrack" class="marquee-track flex items-center gap-10 text-[10px] md:text-xs font-semibold px-4 text-stone-200">
                        <span class="text-stone-400">Loading competition results...</span>
                    </div>
                </div>
            </div>
        </footer>

        <!-- ─────────────────────────────────────────────
             THE POSTER OVERLAY (1:1 RATIO, PERFECT ALIGNMENT)
             ───────────────────────────────────────────── -->
        <div id="posterAnnouncementOverlay" class="fixed inset-0 z-50 hidden items-center justify-center bg-stone-900/60 p-4 md:p-6">
            
            <div id="posterDynamicCard" class="poster-card-entrance relative h-[88vh] aspect-square rounded-[2rem] shadow-2xl overflow-hidden flex flex-col bg-gradient-to-br from-[#ffffff] via-[#fbf8f4] to-[#f0ece4] mx-auto">
                
                <!-- TOP SECTION: Light Beige Workspace -->
                <div class="relative z-10 flex-1 flex flex-col px-12 pt-10 overflow-hidden">
                    
                    <!-- Header -->
                    <div class="relative z-20 flex justify-between items-center mb-8 border-b border-stone-200 pb-5">
                        <img src="../assets/icflgo.svg" alt="ICF" class="h-14 w-auto object-contain flex-shrink-0">
                        <span class="cinzel-font text-stone-800 text-2xl font-black tracking-[0.25em] uppercase whitespace-nowrap px-4 text-center">
                            Sweets of Madina '26
                        </span>
                        <div class="w-14 h-14 bg-stone-800 svg-mask flex-shrink-0" style="-webkit-mask-image: url('../assets/qlb.svg'); mask-image: url('../assets/qlb.svg');"></div>
                    </div>

                    <!-- Inner Body -->
                    <div class="relative flex-1 flex flex-col z-10 pb-4">
                        
                        <!-- Watermark -->
                        <div class="absolute right-[2%] top-[10%] bottom-[5%] flex items-center justify-center pointer-events-none select-none z-0">
                            <div class="vertical-results-watermark">RESULTS</div>
                        </div>

                        <!-- Program Details -->
                        <div class="relative z-10 flex items-center mb-8">
                            <div id="posterProgCode" class="mono-font text-[75px] leading-none font-black text-stone-300 w-28 text-right pr-6 border-r-[4px] border-amber-500">01</div>
                            <div class="flex flex-col pl-6 justify-center">
                                <span id="posterCategory" class="ml-font text-stone-500 font-bold uppercase tracking-widest text-xs mb-1">സീനിയർ</span>
                                <h2 id="posterProgName" class="ml-font text-4xl font-black text-stone-900 tracking-tight leading-none line-clamp-2">ഖിറാഅത്ത്</h2>
                            </div>
                        </div>

                        <!-- Dynamic Winners List -->
                        <div id="posterWinnersContainer" class="relative z-10 flex-1 flex flex-col justify-center w-full pr-16">
                            <!-- JS Injected -->
                        </div>

                    </div>
                </div>

                <!-- BOTTOM SECTION: Dynamic Gradient Footer -->
                <div id="posterGradientFooter" class="h-[22%] w-full relative px-12 py-5 flex items-center justify-between text-white shadow-[inset_0_10px_20px_rgba(0,0,0,0.05)] z-20">
                    
                    <div class="flex-1 max-w-[60%]">
                        <div class="flex items-center gap-3 mb-2">
                            <span class="px-2.5 py-1 rounded-full bg-white/20 text-white font-bold text-[9px] tracking-widest uppercase backdrop-blur-sm border border-white/30 shadow-sm whitespace-nowrap">
                                <span class="inline-block w-1.5 h-1.5 bg-white rounded-full animate-pulse mr-1"></span> LIVE RESULT
                            </span>
                            <span id="posterQueueCounter" class="text-[10px] font-mono text-white/90 uppercase font-bold tracking-wider whitespace-nowrap">Queue: 1/1</span>
                        </div>
                        <div class="w-full h-1 bg-black/20 rounded-full overflow-hidden shadow-inner">
                            <div id="posterTimeFill" class="h-full bg-white shadow-[0_0_10px_rgba(255,255,255,0.8)]"></div>
                        </div>
                    </div>

                    <div class="flex items-center gap-4 flex-shrink-0">
                        <div class="text-right flex flex-col justify-center">
                            <span class="text-white font-black text-base uppercase tracking-wider drop-shadow-md">Download</span>
                            <span class="text-white/80 text-[9px] font-bold tracking-widest uppercase drop-shadow-sm">Scan High-Res Poster</span>
                        </div>
                        <div class="bg-white p-1.5 rounded-xl shadow-xl flex-shrink-0">
                            <img id="posterQrImage" src="" alt="QR" class="w-16 h-16 object-contain rounded-lg mix-blend-multiply">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="../js/live-display.js"></script>
</body>
</html>
