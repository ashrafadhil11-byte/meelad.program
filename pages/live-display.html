<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Championship Signage - Landscape</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&family=Cinzel:wght@700;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --sand-bg: #f5ebe1;
            --text-dark: #1e1b18;
            --emerald-accent: #0f5132;
            --gold-accent: #c59b27;
            --glass-bg: rgba(255, 255, 255, 0.72);
            --glass-border: rgba(210, 185, 155, 0.45);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--sand-bg);
            color: var(--text-dark);
            margin: 0;
            overflow: hidden;
            user-select: none;
        }

        .cinzel-font { font-family: 'Cinzel', serif; }
        .mono-font { font-family: 'JetBrains Mono', monospace; }

        /* Fullscreen Madinah Background */
        .bg-canvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            background: url('../assets/MLDBGLND.png'), url('../assets/MLDBG.svg'), #f5ebe1;
            background-size: cover;
            background-position: right bottom;
            background-repeat: no-repeat;
        }

        /* Glassmorphic Panel on Open Space */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 16px 36px -10px rgba(78, 52, 28, 0.08);
        }

        /* SVG Masking Class for Campaign Logo */
        .svg-mask {
            -webkit-mask-size: contain;
            mask-size: contain;
            -webkit-mask-position: center;
            mask-position: center;
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
        }

        /* View Transition Animations */
        .screen-view { display: none; opacity: 0; }
        .screen-view.active {
            display: flex;
            animation: modernFadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes modernFadeIn {
            from { opacity: 0; transform: translateY(12px) scale(0.99); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Announcement Takeover Animation */
        .announce-active {
            display: flex !important;
            animation: cinematicPop 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        .announce-exit {
            animation: cinematicFadeOut 0.6s ease-in forwards;
        }
        @keyframes cinematicPop {
            0% { opacity: 0; transform: scale(0.9) translateY(30px); filter: blur(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
        }
        @keyframes cinematicFadeOut {
            0% { opacity: 1; transform: scale(1); filter: blur(0); }
            100% { opacity: 0; transform: scale(1.05); filter: blur(10px); }
        }

        /* Continuous Bottom Ticker */
        .marquee-track {
            display: flex;
            white-space: nowrap;
            animation: marqueeSlide 30s linear infinite;
        }
        @keyframes marqueeSlide {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
    </style>
</head>
<body class="h-screen w-screen relative">
    <!-- Mosque Artwork Layer -->
    <div class="bg-canvas"></div>

    <!-- Main Live Presentation Layout -->
    <div class="relative z-10 h-screen w-screen flex flex-col justify-between">
        
        <!-- TOP ZONE: Header + Metric Badges + Logos -->
        <header class="px-10 pt-8 pb-4 flex items-center justify-between w-full">
            
            <!-- Left Header (Main Logo & Title) -->
            <div class="flex items-center gap-6">
                
                <!-- MAIN LOGO (ICFLGO) Adjusted to h-16 for better balance -->
                <img src="../assets/icflgo.svg" alt="ICF Logo" class="h-16 w-auto object-contain drop-shadow-md">
                
                <div class="mt-2">
                    <div class="flex items-center gap-2 mb-1">
                        <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-emerald-700/10 text-emerald-800 text-[11px] font-black tracking-widest uppercase border border-emerald-700/20">
                            <span class="w-2 h-2 rounded-full bg-emerald-600 animate-pulse"></span> LIVE BROADCAST
                        </span>
                        <span id="statLastUpdated" class="text-xs text-stone-500 font-semibold tracking-wide">Syncing...</span>
                    </div>
                    <h1 id="liveMeeladName" class="cinzel-font text-3xl md:text-4xl font-black tracking-tight text-stone-900 leading-none">
                        MEELAD CHAMPIONSHIP
                    </h1>
                </div>
            </div>

            <!-- Right Header (Metrics & Campaign Logo) -->
            <div class="flex items-center gap-8 mt-2">
                
                <div class="glass-panel rounded-2xl px-6 py-2.5 flex items-center gap-8 border">
                    <div class="text-left">
                        <div class="text-[10px] uppercase tracking-widest font-black text-stone-500">Programs</div>
                        <div id="statCompletedProg" class="mono-font text-xl font-bold text-emerald-800">- / -</div>
                    </div>
                    <div class="h-7 w-px bg-stone-300"></div>
                    <div class="text-left">
                        <div class="text-[10px] uppercase tracking-widest font-black text-stone-500">Progress</div>
                        <div id="statProgressPct" class="mono-font text-xl font-bold text-amber-700">-%</div>
                    </div>
                    <div class="h-7 w-px bg-stone-300"></div>
                    <div class="text-left">
                        <div class="text-[10px] uppercase tracking-widest font-black text-stone-500">Pending</div>
                        <div id="statPendingProg" class="mono-font text-xl font-bold text-stone-700">-</div>
                    </div>
                </div>

                <div class="w-16 h-16 bg-amber-700/90 svg-mask drop-shadow-md" 
                     style="-webkit-mask-image: url('../assets/qlb.svg'); mask-image: url('../assets/qlb.svg');">
                </div>
            </div>
        </header>

        <!-- MIDDLE ZONE: Content on Left (60% width), Dome Free on Right -->
        <main class="flex-1 px-10 py-2 flex flex-col justify-center max-w-[62vw] relative">
            
            <!-- NEW RESULT CINEMATIC TAKEOVER (Hidden by default) -->
            <div id="newResultOverlay" class="absolute inset-0 z-50 hidden flex-col items-center justify-center bg-stone-900/80 backdrop-blur-xl rounded-3xl border-2 border-amber-500/40 p-10 text-center shadow-[0_0_60px_rgba(197,155,39,0.3)] mx-4 my-2">
                <div class="text-amber-500 font-black tracking-widest uppercase text-xs mb-3 animate-pulse flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-amber-500"></span> JUST ANNOUNCED
                </div>
                <h2 id="announceProgramName" class="cinzel-font text-4xl font-black text-white mb-3">Program Name</h2>
                <div id="announceCategory" class="inline-block px-4 py-1 bg-stone-800 text-amber-400 border border-amber-500/20 text-xs font-bold rounded-full mb-8 uppercase tracking-widest">Category</div>
                
                <div class="w-full max-w-md bg-white/5 border border-white/10 rounded-2xl p-6 relative overflow-hidden">
                    <div class="absolute -right-4 -top-4 text-7xl opacity-10">🥇</div>
                    <div class="text-stone-400 text-[10px] uppercase tracking-widest font-bold mb-1">First Place Winner</div>
                    <h3 id="announceWinner" class="text-3xl font-black text-emerald-400 mb-1 drop-shadow-md">Winner Name</h3>
                    <div id="announceTeam" class="text-lg font-bold text-stone-300 uppercase tracking-wide">Team Name</div>
                </div>
            </div>

            <!-- Rotating View Header Indicator -->
            <div class="flex items-center justify-between mb-4 px-1 opacity-100 transition-opacity duration-300" id="normalViewHeader">
                <div class="flex items-center gap-3">
                    <span id="viewTitle" class="cinzel-font text-2xl font-black uppercase text-stone-800 tracking-wider">Overall Standings</span>
                    <span id="viewCategoryBadge" class="hidden text-xs font-bold uppercase tracking-wider px-2.5 py-0.5 rounded-md bg-amber-500/20 text-amber-900 border border-amber-500/30"></span>
                </div>
                <div class="w-36 h-1.5 bg-stone-300/60 rounded-full overflow-hidden">
                    <div id="rotatorProgressFill" class="h-full bg-emerald-700 w-0"></div>
                </div>
            </div>

            <div id="screenTeamChampionship" class="screen-view active flex-col w-full">
                <div id="teamChampionshipGrid" class="space-y-2.5"></div>
            </div>

            <div id="screenCategoryLeaders" class="screen-view flex-col w-full">
                <div id="categoryLeadersContainer" class="w-full"></div>
            </div>

            <div id="screenCategoryComparison" class="screen-view flex-col w-full">
                <div id="categoryComparisonContainer" class="space-y-2 w-full"></div>
            </div>
        </main>

        <!-- BOTTOM ZONE: Sponsors & Results Ticker -->
        <footer class="w-full flex flex-col">
            <div class="px-10 py-2 flex items-center justify-between">
                <div class="flex items-center gap-6">
                    <span class="text-[10px] font-black uppercase tracking-widest text-stone-500">Official Sponsors</span>
                    <div id="sponsorLogoContainer" class="flex items-center gap-5">
                        <span class="text-xs font-black tracking-wider text-stone-700 bg-white/70 border border-stone-200 px-3 py-1 rounded-md shadow-xs">AL-FARHA CARGO</span>
                        <span class="text-xs font-black tracking-wider text-stone-700 bg-white/70 border border-stone-200 px-3 py-1 rounded-md shadow-xs">NUVAN LOGISTICS</span>
                    </div>
                </div>
            </div>

            <div class="h-11 bg-stone-900 text-stone-100 flex items-center overflow-hidden shadow-lg border-t border-amber-600/30">
                <div class="h-full px-5 bg-amber-600 text-stone-950 font-black text-xs uppercase tracking-widest flex items-center gap-2 flex-shrink-0 z-10 shadow-md">
                    <span>🔥</span> RESULTS
                </div>
                <div class="flex-1 overflow-hidden h-full flex items-center">
                    <div id="ribbonTrack" class="marquee-track flex items-center gap-10 text-xs font-semibold px-4 text-stone-200">
                        <span class="text-stone-400">Loading competition results...</span>
                    </div>
                </div>
            </div>
        </footer>

    </div>

    <script type="module" src="../js/live-display.js"></script>
</body>
</html>
