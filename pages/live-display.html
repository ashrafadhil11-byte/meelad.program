<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Championship Signage - Landscape</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Manjari:wght@400;700&family=Anek+Malayalam:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;600;700;800;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --sand-bg: #f5ebe1;
            --text-dark: #1e1b18;
            --glass-bg: rgba(255, 255, 255, 0.76);
            --glass-border: rgba(210, 185, 155, 0.45);
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Manjari', sans-serif;
            background-color: var(--sand-bg);
            color: var(--text-dark);
            margin: 0;
            overflow: hidden;
            user-select: none;
        }

        .cinzel-font { font-family: 'Cinzel', serif; }
        .mono-font { font-family: 'JetBrains Mono', monospace; }
        .ml-font { font-family: 'Anek Malayalam', 'Manjari', sans-serif; }

        .bg-canvas {
            position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0;
            background: url('../assets/MLDBGLND.png'), url('../assets/MLDBG.svg'), #f5ebe1;
            background-size: cover; background-position: right bottom; background-repeat: no-repeat;
        }

        .glass-panel {
            background: var(--glass-bg); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--glass-border); box-shadow: 0 16px 36px -10px rgba(78, 52, 28, 0.08);
        }

        .svg-mask {
            -webkit-mask-size: contain; mask-size: contain;
            -webkit-mask-position: center; mask-position: center;
            -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
        }

        .screen-view { display: none; opacity: 0; }
        .screen-view.active { display: flex; animation: modernFadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes modernFadeIn {
            from { opacity: 0; transform: translateY(12px) scale(0.99); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .poster-overlay-active { display: flex !important; animation: fadeInOverlay 0.5s ease forwards; }
        .poster-overlay-exit { animation: fadeOutOverlay 0.6s ease forwards; }
        @keyframes fadeInOverlay { from { opacity: 0; backdrop-filter: blur(0px); } to { opacity: 1; backdrop-filter: blur(12px); } }
        @keyframes fadeOutOverlay { from { opacity: 1; backdrop-filter: blur(12px); } to { opacity: 0; backdrop-filter: blur(0px); } }

        .poster-card-entrance { animation: cardPop 0.8s cubic-bezier(0.2, 1.2, 0.3, 1) forwards; }
        @keyframes cardPop {
            0% { opacity: 0; transform: scale(0.8) translateY(40px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* Fixed Watermark constraints to prevent jumping out of the 1:1 box */
        .vertical-results-watermark {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-size: clamp(4rem, 10vh, 7rem);
            font-weight: 900;
            letter-spacing: 0.1em;
            color: transparent;
            -webkit-text-stroke: 1.5px rgba(0, 0, 0, 0.04);
            line-height: 1;
        }

        .marquee-track { display: flex; white-space: nowrap; animation: marqueeSlide 30s linear infinite; }
        @keyframes marqueeSlide { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
    </style>
</head>
<body class="h-screen w-screen relative flex items-center justify-center">
    <div class="bg-canvas"></div>

    <div class="relative z-10 h-screen w-screen flex flex-col justify-between">
        
        <!-- TOP ZONE: Header Bar -->
        <header class="px-10 pt-7 pb-3 flex items-center justify-between w-full transition-opacity duration-500" id="normalTopHeader">
            <div class="flex items-center gap-5">
                <img src="../assets/icflgo.svg" alt="Main Logo" class="h-16 w-auto object-contain drop-shadow-md">
                <div class="mt-1">
                    <div class="flex items-center gap-2 mb-1">
                        <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-emerald-700/10 text-emerald-800 text-[11px] font-black tracking-widest uppercase border border-emerald-700/20">
                            <span class="w-2 h-2 rounded-full bg-emerald-600 animate-pulse"></span> LIVE BROADCAST
                        </span>
                        <span id="statLastUpdated" class="text-xs text-stone-500 font-semibold tracking-wide">Syncing...</span>
                    </div>
                    <h1 id="liveMeeladName" class="cinzel-font text-3xl font-black tracking-tight text-stone-900 leading-none">MEELAD CHAMPIONSHIP</h1>
                </div>
            </div>

            <div class="flex items-center gap-6 mt-1">
                <div class="glass-panel rounded-2xl px-6 py-2 flex items-center gap-7 border">
                    <div class="text-left">
                        <div class="text-[10px] uppercase tracking-widest font-black text-stone-500">Programs</div>
                        <div id="statCompletedProg" class="mono-font text-lg font-bold text-emerald-800">- / -</div>
                    </div>
                    <div class="h-7 w-px bg-stone-300"></div>
                    <div class="text-left">
                        <div class="text-[10px] uppercase tracking-widest font-black text-stone-500">Progress</div>
                        <div id="statProgressPct" class="mono-font text-lg font-bold text-amber-700">-%</div>
                    </div>
                    <div class="h-7 w-px bg-stone-300"></div>
                    <div class="text-left">
                        <div class="text-[10px] uppercase tracking-widest font-black text-stone-500">Pending</div>
                        <div id="statPendingProg" class="mono-font text-lg font-bold text-stone-700">-</div>
                    </div>
                </div>
                <div class="w-14 h-14 bg-amber-700/90 svg-mask drop-shadow-md" style="-webkit-mask-image: url('../assets/qlb.svg'); mask-image: url('../assets/qlb.svg');"></div>
            </div>
        </header>

        <!-- MIDDLE ZONE: Main Viewport -->
        <main class="flex-1 px-10 py-1 flex flex-col justify-center max-w-[62vw] relative">
            <div class="flex items-center justify-between mb-4 px-1 transition-opacity duration-500" id="normalViewHeader">
                <div class="flex items-center gap-3">
                    <span id="viewTitle" class="cinzel-font text-2xl font-black uppercase text-stone-800 tracking-wider">Overall Standings</span>
                    <span id="viewCategoryBadge" class="hidden text-xs font-bold uppercase tracking-wider px-2.5 py-0.5 rounded-md bg-amber-500/20 text-amber-900 border border-amber-500/30"></span>
                </div>
                <div class="w-36 h-1.5 bg-stone-300/60 rounded-full overflow-hidden">
                    <div id="rotatorProgressFill" class="h-full bg-emerald-700 w-0"></div>
                </div>
            </div>

            <div id="screenTeamChampionship" class="screen-view active flex-col w-full">
                <div id="teamChampionshipGrid" class="space-y-2.5"></div>
            </div>
            <div id="screenCategoryLeaders" class="screen-view flex-col w-full">
                <div id="categoryLeadersContainer" class="w-full"></div>
            </div>
            <div id="screenCategoryComparison" class="screen-view flex-col w-full">
                <div id="categoryComparisonContainer" class="space-y-2 w-full"></div>
            </div>
        </main>

        <!-- BOTTOM ZONE -->
        <footer class="w-full flex flex-col transition-opacity duration-500" id="normalFooter">
            <div class="px-10 py-1.5 flex items-center justify-between">
                <div class="flex items-center gap-6">
                    <span class="text-[10px] font-black uppercase tracking-widest text-stone-500">Official Sponsors</span>
                    <div id="sponsorLogoContainer" class="flex items-center gap-5">
                        <span class="text-xs font-black tracking-wider text-stone-700 bg-white/70 border border-stone-200 px-3 py-1 rounded-md shadow-xs">AL-FARHA CARGO</span>
                        <span class="text-xs font-black tracking-wider text-stone-700 bg-white/70 border border-stone-200 px-3 py-1 rounded-md shadow-xs">NUVAN LOGISTICS</span>
                    </div>
                </div>
            </div>
            <div class="h-11 bg-stone-900 text-stone-100 flex items-center overflow-hidden shadow-lg border-t border-amber-600/30">
                <div class="h-full px-5 bg-amber-600 text-stone-950 font-black text-xs uppercase tracking-widest flex items-center gap-2 flex-shrink-0 z-10 shadow-md">
                    <span>🔥</span> RESULTS
                </div>
                <div class="flex-1 overflow-hidden h-full flex items-center">
                    <div id="ribbonTrack" class="marquee-track flex items-center gap-10 text-xs font-semibold px-4 text-stone-200">
                        <span class="text-stone-400">Loading competition results...</span>
                    </div>
                </div>
            </div>
        </footer>

        <!-- ─────────────────────────────────────────────
             THE POSTER OVERLAY (1:1 RATIO, LIGHT TOP + GRADIENT BOTTOM)
             ───────────────────────────────────────────── -->
        <div id="posterAnnouncementOverlay" class="fixed inset-0 z-50 hidden items-center justify-center bg-stone-900/60 p-6">
            
            <!-- 1:1 Aspect Ratio Card (Perfect Square) -->
            <div id="posterDynamicCard" class="poster-card-entrance relative w-[88vh] h-[88vh] aspect-square rounded-[2rem] shadow-2xl overflow-hidden flex flex-col bg-[#fdfbf7]">
                
                <!-- Background Decoration (RESULTS Watermark) safely constrained -->
                <div class="absolute right-3 top-[30%] z-0 pointer-events-none select-none">
                    <div class="vertical-results-watermark">RESULTS</div>
                </div>

                <!-- TOP SECTION: Light Beige Workspace -->
                <div class="relative z-10 flex-1 flex flex-col px-10 pt-8 pb-4">
                    
                    <!-- Header (Logos + Sweets of Madina) -->
                    <div class="flex justify-between items-center mb-6 border-b border-stone-200 pb-4">
                        <img src="../assets/icflgo.svg" alt="ICF" class="h-12 w-auto object-contain">
                        <span class="cinzel-font text-stone-800 text-xl font-black tracking-[0.25em] uppercase">
                            Sweets of Madina '26
                        </span>
                        <div class="w-12 h-12 bg-stone-800 svg-mask" style="-webkit-mask-image: url('../assets/qlb.svg'); mask-image: url('../assets/qlb.svg');"></div>
                    </div>

                    <!-- Program Details -->
                    <div class="flex items-center gap-5 mb-6">
                        <div id="posterProgCode" class="mono-font text-6xl font-black text-stone-300">03</div>
                        <div class="flex flex-col border-l-[3px] border-amber-500 pl-5">
                            <span id="posterCategory" class="ml-font text-stone-500 font-bold uppercase tracking-widest text-[11px] mb-1">സീനിയർ</span>
                            <h2 id="posterProgName" class="ml-font text-4xl font-black text-stone-900 tracking-tight leading-none line-clamp-2">ഖിറാഅത്ത്</h2>
                        </div>
                    </div>

                    <!-- Dynamic Winners List -->
                    <div id="posterWinnersContainer" class="flex-1 flex flex-col justify-center z-10 w-full pr-16">
                        <!-- JS Injected Typography -->
                    </div>
                </div>

                <!-- BOTTOM SECTION: Dynamic Gradient (95% Top-Left to 60% Bottom-Right) -->
                <div id="posterGradientFooter" class="h-[25%] w-full relative px-10 py-5 flex items-center justify-between text-white shadow-[inset_0_10px_20px_rgba(0,0,0,0.05)]">
                    
                    <!-- Left: Status & Progress -->
                    <div class="flex-1 max-w-[60%]">
                        <div class="flex items-center gap-3 mb-2.5">
                            <span class="px-2.5 py-1 rounded-full bg-white/20 text-white font-bold text-[9px] tracking-widest uppercase backdrop-blur-sm border border-white/30 shadow-sm">
                                <span class="inline-block w-1.5 h-1.5 bg-white rounded-full animate-pulse mr-1"></span> LIVE RESULT
                            </span>
                            <span id="posterQueueCounter" class="text-[10px] font-mono text-white/90 uppercase font-bold tracking-wider">Queue: 1/1</span>
                        </div>
                        <div class="w-full h-1 bg-black/20 rounded-full overflow-hidden shadow-inner">
                            <div id="posterTimeFill" class="h-full bg-white shadow-[0_0_10px_rgba(255,255,255,0.8)]"></div>
                        </div>
                    </div>

                    <!-- Right: QR Code -->
                    <div class="flex items-center gap-4">
                        <div class="text-right flex flex-col justify-center">
                            <span class="text-white font-black text-base uppercase tracking-wider drop-shadow-md">Download</span>
                            <span class="text-white/80 text-[9px] font-bold tracking-widest uppercase drop-shadow-sm">Scan High-Res Poster</span>
                        </div>
                        <div class="bg-white p-1.5 rounded-[1rem] shadow-xl">
                            <!-- QR Image injected via JS API -->
                            <img id="posterQrImage" src="" alt="QR" class="w-16 h-16 object-contain rounded-lg mix-blend-multiply">
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script type="module" src="../js/live-display.js"></script>
</body>
</html>
