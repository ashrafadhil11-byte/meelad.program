<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Championship Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #070B14; }
    </style>
</head>
<body class="min-h-screen text-slate-100 flex flex-col justify-center items-center p-6 relative overflow-hidden">
    <!-- Ambient Backdrop -->
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <main class="w-full max-w-md bg-slate-900/80 border border-slate-800 backdrop-blur-xl p-8 rounded-3xl shadow-2xl relative z-10">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-amber-500/10 border border-amber-500/20 text-3xl mb-4">
                🏆
            </div>
            <h1 class="text-2xl font-black tracking-tight text-white">Championship Portal</h1>
            <p class="text-slate-400 text-sm mt-1">Launch live display screen for projectors & TVs</p>
        </div>

        <form id="launchForm" class="space-y-5">
            <div>
                <label for="instIdInput" class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">
                    Institute / Event ID
                </label>
                <input 
                    type="text" 
                    id="instIdInput" 
                    placeholder="e.g., melad-2026" 
                    required
                    class="w-full bg-slate-950/60 border border-slate-700/80 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-amber-500/50 focus:border-amber-500 transition-all font-mono text-sm"
                />
            </div>

            <button 
                type="submit" 
                class="w-full py-3.5 px-6 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-bold text-sm tracking-wide shadow-lg shadow-amber-500/20 active:scale-[0.99] transition-all flex items-center justify-center gap-2"
            >
                <span>Launch Live Display</span>
                <span>📺</span>
            </button>
        </form>

        <div class="mt-6 pt-6 border-t border-slate-800/80 text-center">
            <p class="text-xs text-slate-500">
                You can also pass the ID via URL parameter: <br>
                <code class="text-amber-400/80 font-mono">pages/live-display.html?id=YOUR_ID</code>
            </p>
        </div>
    </main>

    <script>
        const savedId = localStorage.getItem('currentInstituteId') || localStorage.getItem('melad_institute_id') || '';
        if (savedId) {
            document.getElementById('instIdInput').value = savedId;
        }

        document.getElementById('launchForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('instIdInput').value.trim();
            if (id) {
                localStorage.setItem('currentInstituteId', id);
                localStorage.setItem('melad_institute_id', id);
                window.location.href = `./pages/live-display.html?id=${encodeURIComponent(id)}`;
            }
        });
    </script>
</body>
</html>
