<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Download Result | Sweets of Madina '26</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Manjari:wght@400;700&family=Anek+Malayalam:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;700;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        body { font-family: 'Plus Jakarta Sans', 'Manjari', sans-serif; background-color: #070B14; color: #ffffff; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .cinzel-font { font-family: 'Cinzel', serif; }
        .mono-font { font-family: 'JetBrains Mono', monospace; }
        .ml-font { font-family: 'Anek Malayalam', 'Manjari', sans-serif; }
        .svg-mask { -webkit-mask-size: contain; mask-size: contain; -webkit-mask-position: center; mask-position: center; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; }
        .vertical-results-watermark { writing-mode: vertical-rl; text-orientation: mixed; font-size: 110px; font-weight: 900; letter-spacing: 0.25em; color: transparent; -webkit-text-stroke: 2px rgba(0, 0, 0, 0.04); line-height: 1; }
        
        #posterWrapper { width: 90%; max-width: 450px; position: relative; overflow: hidden; margin: 2rem auto; border-radius: 1.5rem; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); background-color: #fdfbf7; }
        #posterCanvas { width: 1080px; height: 1080px; position: absolute; top: 0; left: 0; transform-origin: top left; display: flex; flex-direction: column; background-color: #fdfbf7; }
        .ambient-glow { position: fixed; top: 30%; left: 50%; transform: translate(-50%, -50%); width: 80vw; height: 80vw; background: radial-gradient(circle, rgba(217, 119, 6, 0.15) 0%, transparent 60%); filter: blur(40px); z-index: -1; pointer-events: none; }
    </style>
</head>
<body class="px-4 py-8">
    <div class="ambient-glow"></div>

    <div class="text-center w-full max-w-md mx-auto mb-2">
        <h1 class="text-2xl font-black cinzel-font tracking-widest text-amber-500 mb-1">Official Result</h1>
        <p class="text-slate-400 text-sm">Review standings and download your poster below.</p>
    </div>

    <!-- The 1080p Poster -->
    <div id="posterWrapper">
        <div id="posterCanvas">
            
            <!-- TOP SECTION -->
            <div class="relative z-10 flex-1 flex flex-col px-12 pt-10 pb-4 text-stone-900 overflow-hidden">
                <div class="relative z-20 flex justify-between items-center mb-8 border-b border-stone-200 pb-5">
                    <img src="./assets/icflgo.svg" alt="ICF" class="h-16 w-auto object-contain">
                    <span class="cinzel-font text-stone-800 text-[26px] font-black tracking-[0.25em] uppercase">Sweets of Madina '26</span>
                    <div class="w-20 h-20 bg-stone-800 svg-mask" style="-webkit-mask-image: url('./assets/qlb.svg'); mask-image: url('./assets/qlb.svg');"></div>
                </div>

                <div class="relative flex-1 flex flex-col z-10 pb-4">
                    <div class="absolute right-2 top-0 bottom-0 z-0 pointer-events-none select-none flex items-center">
                        <div class="vertical-results-watermark">RESULTS</div>
                    </div>

                    <!-- Program Details -->
                    <div class="relative z-10 flex items-center gap-6 mb-8">
                        <div id="posterProgCode" class="mono-font text-[80px] font-black text-stone-300 leading-none">--</div>
                        <div class="flex flex-col border-l-[4px] border-amber-500 pl-6 py-2">
                            <span id="posterCategory" class="ml-font text-stone-500 font-bold uppercase tracking-widest text-lg mb-1">Category</span>
                            <h2 id="posterProgName" class="ml-font text-5xl font-black text-stone-900 tracking-tight leading-none line-clamp-2">Loading...</h2>
                        </div>
                    </div>

                    <div id="posterWinnersContainer" class="relative z-10 flex-1 flex flex-col justify-center w-full pr-12">
                        <div class="text-stone-400 font-bold text-2xl animate-pulse">Fetching official records...</div>
                    </div>
                </div>
            </div>

            <!-- BOTTOM SECTION: Dynamic Gradient Footer -->
            <div id="posterGradientFooter" class="h-[26%] w-full relative px-12 flex items-center justify-between text-white shadow-[inset_0_10px_20px_rgba(0,0,0,0.05)] bg-slate-900 z-20">
                <div class="flex-1">
                    <div class="flex items-center gap-3 mb-2">
                        <span class="px-4 py-1.5 rounded-full bg-white/20 text-white font-bold text-xs tracking-widest uppercase backdrop-blur-sm border border-white/30 shadow-sm">
                            <span class="inline-block w-2.5 h-2.5 bg-white rounded-full mr-2"></span> VERIFIED
                        </span>
                    </div>
                    <p class="text-white/80 font-medium text-lg mt-2">Official Championship Result</p>
                </div>

                <div class="flex items-center gap-5">
                    <div class="text-right flex flex-col justify-center">
                        <span class="text-white font-black text-2xl uppercase tracking-wider drop-shadow-md">Meelad '26</span>
                        <span class="text-white/80 text-sm font-bold tracking-widest uppercase drop-shadow-sm">Scan to Verify</span>
                    </div>
                    <div class="bg-white p-2.5 rounded-[1.25rem] shadow-xl">
                        <img id="posterQrImage" src="" alt="QR" class="w-24 h-24 object-contain rounded-lg mix-blend-multiply">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Action Buttons -->
    <div class="w-full max-w-md mx-auto flex flex-col gap-3 mt-2 mb-10">
        <button id="btnDownload" class="w-full py-4 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-black text-lg tracking-wide shadow-[0_0_20px_rgba(245,158,11,0.3)] transition-all flex items-center justify-center gap-3">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
            Download HD Poster
        </button>
        <button id="btnReturn" class="w-full py-3.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white font-bold text-sm tracking-wide transition-all flex items-center justify-center gap-2">
            Return to Live TV Display
        </button>
    </div>

    <script type="module">
        import { db, doc, getDoc, collection, query, where, getDocs } from './js/firebase.js';

        let targetInstId = '';

        function resizePoster() {
            const wrapper = document.getElementById('posterWrapper');
            const canvas = document.getElementById('posterCanvas');
            const width = wrapper.clientWidth;
            const scale = width / 1080;
            canvas.style.transform = `scale(${scale})`;
            wrapper.style.height = `${1080 * scale}px`;
        }
        window.addEventListener('resize', resizePoster);
        document.fonts.ready.then(resizePoster);
        setTimeout(resizePoster, 100);

        function getGradientForString(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
            const gradients = [
                'linear-gradient(to bottom right, #450a0a, #dc2626)', 'linear-gradient(to bottom right, #172554, #2563eb)',
                'linear-gradient(to bottom right, #052e16, #16a34a)', 'linear-gradient(to bottom right, #3b0764, #9333ea)',
                'linear-gradient(to bottom right, #431407, #ea580c)', 'linear-gradient(to bottom right, #042f2e, #0d9488)',
                'linear-gradient(to bottom right, #4c0519, #e11d48)'
            ];
            return gradients[Math.abs(hash) % gradients.length];
        }

        function escapeHTML(str) {
            if (!str) return ''; const div = document.createElement('div'); div.textContent = str; return div.innerHTML;
        }

        async function fetchAndRenderResult() {
            const params = new URLSearchParams(window.location.search);
            targetInstId = params.get('id');
            const progId = params.get('prog');

            if (!targetInstId || !progId) {
                document.getElementById('posterWinnersContainer').innerHTML = `<div class="text-red-500 font-bold text-2xl">Error: Missing ID in URL.</div>`;
                return;
            }

            try {
                const resultsCol = collection(db, "institutes", targetInstId, "results");
                let resData = null;
                const q = query(resultsCol, where("programId", "==", progId));
                const qSnap = await getDocs(q);
                
                if (!qSnap.empty) {
                    resData = qSnap.docs[0].data();
                } else {
                    const docSnap = await getDoc(doc(resultsCol, progId));
                    if (docSnap.exists()) resData = docSnap.data();
                }

                if (!resData || resData.status !== 'published') {
                    document.getElementById('posterWinnersContainer').innerHTML = `<div class="text-red-500 font-bold text-2xl">Result not found or not published.</div>`;
                    return;
                }

                // Inject Colors & Details
                const stableId = resData.programId || progId;
                document.getElementById('posterGradientFooter').style.background = getGradientForString(stableId);
                document.getElementById('posterCategory').textContent = resData.categoryName || 'General';
                document.getElementById('posterQrImage').src = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&format=svg&color=000000&bgcolor=ffffff&data=${encodeURIComponent(window.location.href)}`;

                // ✅ FIXED: Prevent double program numbers (e.g. 03 03 Calligraphy)
                let pCode = resData.programCode ? String(resData.programCode).padStart(2, '0') : '01';
                let pName = resData.programName || 'Competition Result';
                
                let rawCode = String(resData.programCode || '').trim();
                let paddedCode = rawCode.padStart(2, '0');
                if (rawCode && pName.toLowerCase().startsWith(rawCode.toLowerCase())) {
                    pName = pName.substring(rawCode.length).trim();
                } else if (paddedCode && pName.toLowerCase().startsWith(paddedCode.toLowerCase())) {
                    pName = pName.substring(paddedCode.length).trim();
                }
                if (pName.startsWith('-') || pName.startsWith(':')) pName = pName.substring(1).trim();

                document.getElementById('posterProgCode').textContent = pCode;
                document.getElementById('posterProgName').textContent = pName;

                // Rank Calculations
                let winnersList = [];
                if (Array.isArray(resData.marksData) && resData.marksData.length > 0) {
                    winnersList = [...resData.marksData].filter(m => m.rank && m.rank <= 3).sort((a, b) => a.rank - b.rank);
                } else if (Array.isArray(resData.winners) && resData.winners.length > 0) {
                    winnersList = [...resData.winners].filter(w => w.rank && w.rank <= 3).sort((a, b) => a.rank - b.rank);
                }

                const winnersContainer = document.getElementById('posterWinnersContainer');
                if (winnersList.length === 0) {
                    winnersContainer.innerHTML = `<div class="text-stone-500 font-bold text-2xl pl-16">No ranked winners recorded.</div>`;
                    return;
                }

                const firstPlace = winnersList.filter(w => w.rank === 1);
                const runnersUp = winnersList.filter(w => w.rank === 2 || w.rank === 3);

                let html = `<div class="flex flex-col gap-7 w-full pl-[90px] mt-4">`;

                firstPlace.forEach(w => {
                    html += `
                    <div class="flex items-center gap-7">
                        <div class="text-[85px] leading-none text-amber-500 font-black drop-shadow-sm flex-shrink-0">1</div>
                        <div class="min-w-0">
                            <div class="ml-font text-[42px] font-black text-stone-900 leading-[1.1] mb-2 truncate max-w-[500px]">
                                ${escapeHTML(w.studentName || w.name || 'Candidate')}
                            </div>
                            <div class="flex items-center gap-3">
                                <span class="text-lg font-bold uppercase tracking-widest text-stone-500">${escapeHTML(w.teamName || w.team || 'Team')}</span>
                                ${w.grade ? `<span class="bg-stone-200 text-stone-600 px-2 py-0.5 rounded text-sm font-mono font-bold">Grade: ${escapeHTML(w.grade)}</span>` : ''}
                            </div>
                        </div>
                    </div>`;
                });

                if (runnersUp.length > 0) {
                    html += `<div class="flex flex-col gap-5 mt-4 pl-3">`;
                    runnersUp.forEach(w => {
                        html += `
                        <div class="flex items-center gap-6">
                            <div class="text-[46px] leading-none text-stone-300 font-black w-12 text-center flex-shrink-0">${w.rank}</div>
                            <div class="min-w-0">
                                <div class="ml-font text-3xl font-bold text-stone-700 leading-none mb-1.5 truncate max-w-[450px]">
                                    ${escapeHTML(w.studentName || w.name || 'Candidate')}
                                </div>
                                <div class="flex items-center gap-2">
                                    <span class="text-sm font-bold uppercase tracking-widest text-stone-400">${escapeHTML(w.teamName || w.team || 'Team')}</span>
                                </div>
                            </div>
                        </div>`;
                    });
                    html += `</div>`;
                }
                html += `</div>`;
                winnersContainer.innerHTML = html;
                
                setTimeout(resizePoster, 300);
            } catch (error) {
                console.error(error);
                document.getElementById('posterWinnersContainer').innerHTML = `<div class="text-red-500 font-bold text-2xl">Error connecting to database.</div>`;
            }
        }

        document.getElementById('btnDownload').addEventListener('click', () => {
            const btn = document.getElementById('btnDownload');
            const originalText = btn.innerHTML;
            btn.innerHTML = `<span class="animate-pulse">Rendering HD Poster...</span>`;
            
            const targetCanvas = document.getElementById('posterCanvas');
            const currentTransform = targetCanvas.style.transform;
            targetCanvas.style.transform = 'scale(1)';

            html2canvas(targetCanvas, { scale: 2, useCORS: true, backgroundColor: '#fdfbf7' }).then(canvas => {
                targetCanvas.style.transform = currentTransform; 
                const link = document.createElement('a');
                link.download = `Result_Poster_${Date.now()}.jpeg`;
                link.href = canvas.toDataURL('image/jpeg', 0.95);
                link.click();
                btn.innerHTML = originalText;
            }).catch(err => {
                targetCanvas.style.transform = currentTransform;
                btn.innerHTML = `Error Generating Poster`;
                setTimeout(() => btn.innerHTML = originalText, 3000);
            });
        });

        document.getElementById('btnReturn').addEventListener('click', () => {
            if(targetInstId) {
                window.location.href = `./pages/live-display.html?id=${targetInstId}`;
            } else {
                window.location.href = './index.html';
            }
        });

        fetchAndRenderResult();
    </script>
</body>
</html>
